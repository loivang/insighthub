apiVersion: v1
kind: Namespace
metadata:
  name: insighthub-loivang
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insighthub-db-init
  namespace: insighthub-loivang
data:
  init.sql: |-
    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS documents (
        id          BIGSERIAL PRIMARY KEY,
        filename    TEXT NOT NULL,
        status      TEXT NOT NULL DEFAULT 'pending'
                    CHECK (status IN ('pending', 'ready', 'failed')),
        chunk_count INTEGER NOT NULL DEFAULT 0,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS chunks (
        id          BIGSERIAL PRIMARY KEY,
        document_id BIGINT NOT NULL REFERENCES documents(id) ON DELETE CASCADE,
        chunk_text  TEXT NOT NULL,
        embedding   VECTOR(1024),
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS chunks_embedding_hnsw_idx
        ON chunks USING hnsw (embedding vector_cosine_ops)
        WITH (m = 16, ef_construction = 64);

    CREATE INDEX IF NOT EXISTS chunks_document_id_idx ON chunks(document_id);
    CREATE INDEX IF NOT EXISTS documents_status_idx ON documents(status);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: insighthub-loivang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insighthub-postgres
  template:
    metadata:
      labels:
        app: insighthub-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.2-pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: insighthub
            - name: POSTGRES_PASSWORD
              value: insighthub
            - name: POSTGRES_DB
              value: insighthub
          volumeMounts:
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: db-init
          configMap:
            name: insighthub-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: insighthub-loivang
spec:
  selector:
    app: insighthub-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: insighthub-loivang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insighthub-redis
  template:
    metadata:
      labels:
        app: insighthub-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: insighthub-loivang
spec:
  selector:
    app: insighthub-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-api
  namespace: insighthub-loivang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insighthub
      component: api
  template:
    metadata:
      labels:
        app: insighthub
        component: api
    spec:
      containers:
        - name: api
          image: insighthub-api:day4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://insighthub:insighthub@postgres:5432/insighthub
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: LLM_PROVIDER
              value: gemini
            - name: EMBEDDING_PROVIDER
              value: local
            - name: EMBEDDING_DIM
              value: "1024"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: insighthub-api
  namespace: insighthub-loivang
  labels:
    app: insighthub
spec:
  selector:
    app: insighthub
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-worker
  namespace: insighthub-loivang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insighthub-worker
  template:
    metadata:
      labels:
        app: insighthub-worker
    spec:
      containers:
        - name: worker
          image: insighthub-worker:day4
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgresql://insighthub:insighthub@postgres:5432/insighthub
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: EMBEDDING_PROVIDER
              value: local
            - name: EMBEDDING_DIM
              value: "1024"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighthub-web
  namespace: insighthub-loivang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insighthub-web
  template:
    metadata:
      labels:
        app: insighthub-web
    spec:
      containers:
        - name: web
          image: insighthub-web:day4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_INTERNAL_URL
              value: http://insighthub-api:8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: insighthub-web
  namespace: insighthub-loivang
  labels:
    app: insighthub-web
spec:
  selector:
    app: insighthub-web
  ports:
    - name: http
      port: 3000
      targetPort: http
